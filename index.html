<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reservar espacio</title>
<style>
:root{
  --bg:#f5f7f4; --card:#ffffff; --ink:#1d2b24; --muted:#5d6b64; --line:#d5ddd8;
  --accent:#1f6f54; --accent-ink:#ffffff; --busy:#e6e9e7; --err:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111a16; --card:#18241e; --ink:#e8efeb; --muted:#9db0a7; --line:#2d3d35;
    --accent:#52c29b; --accent-ink:#0b1712; --busy:#202d27; --err:#ff8a80; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px 48px}
main{max-width:560px;margin:0 auto}
h1{font-size:1.8rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 24px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 12px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input[type=text],input[type=email],input[type=tel],input[type=date]{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.slot{padding:10px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.slot[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.slot:disabled{background:var(--busy);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin-top:16px}
.check input{margin-top:4px}
button.send{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
button.send:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:12px;font-weight:600}
.msg.err{color:var(--err)} .msg.ok{color:var(--accent)}
.hint{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Reserva tu espacio</h1>
  <p class="sub">Elige un día y una hora. Recibirás la confirmación en tu correo.</p>

  <section>
    <h2>1. Día y hora</h2>
    <label for="fecha">Día</label>
    <input type="date" id="fecha">
    <label style="margin-top:16px">Horarios disponibles</label>
    <div class="slots" id="slots" role="group" aria-label="Horarios"></div>
    <p class="hint" id="slotsHint">Elige un día para ver los horarios.</p>
  </section>

  <section>
    <h2>2. Tus datos</h2>
    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" autocomplete="name" maxlength="100">
    <label for="correo">Correo</label>
    <input type="email" id="correo" autocomplete="email">
    <label for="telefono">Teléfono o WhatsApp</label>
    <input type="tel" id="telefono" autocomplete="tel" maxlength="20">
    <label class="check">
      <input type="checkbox" id="acepta">
      <span>Autorizo el tratamiento de mis datos personales para gestionar esta reserva (Ley 1581 de 2012).</span>
    </label>
    <button class="send" id="enviar" disabled>Reservar</button>
    <div class="msg" id="msg" role="status"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== CONFIGURA AQUÍ ======
const SUPABASE_URL = "https://TU-PROYECTO.supabase.co";
const SUPABASE_ANON_KEY = "TU_ANON_KEY";
const ESPACIO = "principal";
const HORA_ABRE = 8, HORA_CIERRA = 20;   // franja diaria (24 h)
const DURACION_H = 1;                    // duración de cada reserva en horas
const TZ = "-05:00";                     // Colombia
// ============================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let elegido = null;

const pad = n => String(n).padStart(2, "0");
const iso = (fecha, h) => new Date(`${fecha}T${pad(h)}:00:00${TZ}`).toISOString();

const hoy = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Bogota"}));
$("fecha").min = `${hoy.getFullYear()}-${pad(hoy.getMonth()+1)}-${pad(hoy.getDate())}`;

async function cargarHorarios() {
  const fecha = $("fecha").value;
  elegido = null; validar();
  const cont = $("slots"); cont.innerHTML = "";
  if (!fecha) return;
  $("slotsHint").textContent = "Cargando…";
  const { data, error } = await db.rpc("horarios_ocupados", {
    p_desde: iso(fecha, 0),
    p_hasta: iso(fecha, 24)
  });
  if (error) { $("slotsHint").textContent = "No se pudieron cargar los horarios. Recarga la página."; return; }
  const ocupados = data.map(r => [new Date(r.inicio).getTime(), new Date(r.fin).getTime()]);
  const ahora = Date.now();
  let libres = 0;
  for (let h = HORA_ABRE; h + DURACION_H <= HORA_CIERRA; h += DURACION_H) {
    const ini = new Date(iso(fecha, h)).getTime();
    const fin = new Date(iso(fecha, h + DURACION_H)).getTime();
    const ocupado = ini <= ahora || ocupados.some(([a, b]) => ini < b && fin > a);
    const b = document.createElement("button");
    b.type = "button"; b.className = "slot"; b.disabled = ocupado;
    b.textContent = `${pad(h)}:00 – ${pad(h + DURACION_H)}:00`;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => {
      cont.querySelectorAll(".slot").forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      elegido = { inicio: iso(fecha, h), fin: iso(fecha, h + DURACION_H) };
      validar();
    };
    if (!ocupado) libres++;
    cont.appendChild(b);
  }
  $("slotsHint").textContent = libres ? "" : "Ese día no tiene horarios libres. Prueba con otro.";
}

function validar() {
  const ok = elegido && $("nombre").value.trim().length >= 2 &&
    /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($("correo").value.trim()) &&
    $("telefono").value.trim().length >= 7 && $("acepta").checked;
  $("enviar").disabled = !ok;
}

async function reservar() {
  const msg = $("msg"); msg.className = "msg"; msg.textContent = "Guardando…";
  $("enviar").disabled = true;
  const { error } = await db.from("reservas").insert({
    espacio: ESPACIO,
    nombre: $("nombre").value.trim(),
    correo: $("correo").value.trim(),
    telefono: $("telefono").value.trim(),
    inicio: elegido.inicio,
    fin: elegido.fin,
    acepta_datos: true
  });
  if (error) {
    msg.className = "msg err";
    msg.textContent = error.code === "23P01"
      ? "Alguien acaba de reservar ese horario. Elige otro."
      : "No pudimos guardar la reserva. Intenta de nuevo.";
    await cargarHorarios();
    return;
  }
  msg.className = "msg ok";
  msg.textContent = "Reserva recibida. Te escribiremos para confirmarla.";
  ["nombre","correo","telefono"].forEach(i => $(i).value = "");
  $("acepta").checked = false;
  await cargarHorarios();
  msg.className = "msg ok"; msg.textContent = "Reserva recibida. Te escribiremos para confirmarla.";
}

$("fecha").addEventListener("change", cargarHorarios);
["nombre","correo","telefono","acepta"].forEach(i => $(i).addEventListener("input", validar));
$("enviar").addEventListener("click", reservar);
</script>
</body>
</html>
